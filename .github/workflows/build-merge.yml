name: 🧪 CI · Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Ref.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_build_common.yml@a989b376b6f85e9643c12231a44640036f8ad1c2
    with:
      ref: ${{ inputs.ref || github.sha }}

  native:
    needs:
      - build
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_build_native.yml@a989b376b6f85e9643c12231a44640036f8ad1c2
    with:
      ref: ${{ needs.build.outputs.commit_sha }}
      version: ${{ needs.build.outputs.version }}
